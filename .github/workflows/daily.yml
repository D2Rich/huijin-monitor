name: huijin-daily
on:
  schedule:
    - cron: "30 16 * * 1-5"     # UTC 16:30 = 北京 00:30, 取当天(UTC日期=交易日)的份额
    - cron: "0 22 * * 1-5"      # UTC 22:00 = 北京 06:00, 补跑一次 (UTC 日期仍是交易日)
    - cron: "30 1 * * 2-6"      # UTC 01:30 = 北京 09:30 次日, 腾讯行情此时已更新前一日份额, 补齐深交所 ≈ 值
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['huijin_monitor.py', '.github/workflows/daily.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: run monitor
        run: python huijin_monitor.py
      - name: commit
        run: |
          git config user.name "huijin-bot"
          git config user.email "bot@users.noreply.github.com"
          git add latest.md reports szse_snapshots.csv
          git commit -m "daily $(date -u +%F)" || echo "nothing to commit"
          git push
